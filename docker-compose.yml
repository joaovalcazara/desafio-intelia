services:
  proxy:
    image: nginx:1.24
    container_name: nginx
    ports:
      - "80:80"
    volumes:
      - ./backend:/var/www
      - ./docker/nginx/backend.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - backend
    networks:
      - api-network

  backend:
    container_name: symfony_api
    build:
      context: ./
      dockerfile: ./backend/Dockerfile
    working_dir: /var/www
    volumes:
      - ./backend:/var/www
    networks:
      - api-network

  db:
    image: mariadb:11.4
    container_name: mariadb
    environment:
      MARIADB_ROOT_PASSWORD: root
      MARIADB_DATABASE: intelia
      MARIADB_USER: intelia
      MARIADB_PASSWORD: intelia
    ports:
      - "3306:3306"
    volumes:
      - database_data:/var/lib/mysql
    networks:
      - api-network
volumes:
  database_data: 
networks:
  api-network:



